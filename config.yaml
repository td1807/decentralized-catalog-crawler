# Crawler configuration.
#
# Requirement #1 of the assignment: no hardcoded URLs. Everything the crawler
# talks to is listed here, and the file is chosen at runtime with --config.
#
# This default config points at the local mock provider files, so the crawler
# runs with no web server involved. Use config.http.yaml to exercise the real
# HTTP path instead.

crawler:
  # Where the aggregated catalog lives. Relative paths are resolved against
  # this config file's directory, so the crawler behaves the same regardless
  # of which folder you launch it from.
  database_path: ./data/catalog.db

  # Networking behaviour.
  request_timeout_seconds: 10      # give up on a silent server after 10s
  max_retries: 3                   # retry transient failures 3 times
  retry_backoff_seconds: 0.5       # 0.5s, then 1s, then 2s between attempts

  # Refuse any single file larger than this. Protects us from a hostile or
  # broken provider streaming an endless response, which would exhaust memory
  # long before any signature check could help.
  max_download_bytes: 10485760     # 10 MiB

providers:
  - id: acme-retail
    manifest_url: ./mock_provider/public/manifest.json
    enabled: true

  # Adding a second provider is a config change only - no code change.
  # - id: globex-services
  #   manifest_url: https://cdn.globex.example.com/manifest.json
  #   enabled: true
